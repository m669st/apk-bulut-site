<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>APK Bulut</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #1b1b1a;
    --muted: #6b6b66;
    --line: #e3e3de;
    --accent: #1f6f4a;
    --accent-text: #ffffff;
    --danger: #a3302a;
    --field: #fbfbf9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121312;
      --card: #1b1c1b;
      --text: #ececea;
      --muted: #9a9a95;
      --line: #2c2d2b;
      --accent: #3fa574;
      --accent-text: #0d1a13;
      --danger: #e0726b;
      --field: #161716;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    min-height: 46px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: flex; gap: 8px; }
  .seg label {
    flex: 1;
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    background: var(--field);
    cursor: pointer;
  }
  .seg label small { display: block; color: var(--muted); font-size: 12px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { border-color: var(--accent); outline: 1px solid var(--accent); }
  button, .btn {
    display: block;
    width: 100%;
    font: inherit;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    border: 0;
    border-radius: 12px;
    padding: 14px;
    min-height: 50px;
    margin-top: 18px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-text);
  }
  button.ikincil {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--line);
    margin-top: 10px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .link { background: none; color: var(--muted); font-weight: 400; min-height: 0; padding: 6px; margin-top: 6px; text-decoration: underline; }
  .hata { color: var(--danger); font-size: 14px; margin: 12px 0 0; }
  .hata:empty { display: none; }
  .adimlar { list-style: none; padding: 0; margin: 4px 0 0; }
  .adimlar li { padding: 6px 0 6px 22px; position: relative; color: var(--muted); font-size: 15px; }
  .adimlar li::before {
    content: ""; position: absolute; left: 4px; top: 13px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--line);
  }
  .adimlar li.bitti { color: var(--text); }
  .adimlar li.bitti::before { background: var(--accent); }
  .adimlar li.simdi { color: var(--text); font-weight: 600; }
  .adimlar li.simdi::before { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .durum-baslik { font-weight: 600; margin: 0; }
  .durum-alt { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
  .kalan { font-variant-numeric: tabular-nums; }
  .not { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .not a { color: inherit; }
  [hidden] { display: none !important; }

  /* Tam ekran oynatıcı */
  #oynatici {
    position: fixed; inset: 0; z-index: 9999;
    background: #000; display: flex; flex-direction: column;
  }
  #ekran { flex: 1; width: 100%; height: 100%; border: 0; display: block; background: #000; }
  #cubuk {
    display: flex; justify-content: center; gap: 28px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: #0a0a0a; border-top: 1px solid #1c1c1c;
  }
  #cubuk button {
    width: auto; min-height: 40px; margin: 0; padding: 6px 18px;
    background: transparent; color: #e6e6e6; border: 0; border-radius: 8px;
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  #cubuk button:active { background: #222; }
  #cubuk #kapatOynatici { color: #e0726b; margin-left: 12px; }
  /* Yatayken kontrol çubuğunu yana al ki ekranın tamamı video olsun */
  @media (orientation: landscape) {
    #oynatici { flex-direction: row; }
    #cubuk { flex-direction: column; border-top: 0; border-left: 1px solid #1c1c1c; padding: 12px 8px; }
  }
</style>
</head>
<body>
<main>
  <h1>APK Bulut</h1>
  <p class="sub">GitHub Actions üzerinde geçici Android oturumu</p>

  <!-- Şifre (cihaz başına bir kez) -->
  <section id="kurulum" class="card" hidden>
    <form id="sifreForm">
      <label for="sifre">Şifre</label>
      <input id="sifre" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <button id="kaydet" type="submit">Giriş</button>
    </form>
    <p class="not">Bu cihazda bir kez sorulur.</p>
    <p class="hata" id="kurulumHata"></p>
  </section>

  <!-- Başlat -->
  <section id="baslat" class="card" hidden>
    <label for="sure">Süre</label>
    <select id="sure">
      <option value="30">30 dakika</option>
      <option value="60" selected>1 saat</option>
      <option value="120">2 saat</option>
      <option value="180">3 saat</option>
      <option value="300">5 saat</option>
    </select>
    <label for="apk">APK linki (isteğe bağlı)</label>
    <input id="apk" type="url" inputmode="url" placeholder="https://…/uygulama.apk" autocapitalize="off" spellcheck="false">
    <button id="baslatBtn">Başlat</button>
    <p class="hata" id="baslatHata"></p>
    <p class="not">Depodaki <code>apks/</code> klasöründeki APK'lar her oturumda otomatik kurulur. Hazırlık 3–5 dakika sürer.</p>
  </section>

  <!-- Oturum -->
  <section id="oturum" class="card" hidden>
    <p class="durum-baslik" id="durumBaslik">Başlatılıyor</p>
    <p class="durum-alt" id="durumAlt"></p>
    <ul class="adimlar" id="adimlar"></ul>
    <button id="acBtn" class="btn" hidden>Android'i aç</button>
    <button id="durdurBtn" class="ikincil">Durdur</button>
    <p class="hata" id="oturumHata"></p>
    <p class="not"><a id="runLink" target="_blank" rel="noopener">GitHub'da ayrıntılar</a></p>
  </section>

  <button id="ayarlarBtn" class="link" hidden>Bu cihazda çıkış yap</button>
</main>

<!-- Tam ekran oynatıcı: akış burada iframe ile gömülür -->
<div id="oynatici" hidden>
  <iframe id="ekran" allow="autoplay; fullscreen; clipboard-write" title="Android"></iframe>
  <div id="cubuk">
    <button data-tus="son" title="Son uygulamalar" aria-label="Son uygulamalar">▢</button>
    <button data-tus="ana" title="Ana ekran" aria-label="Ana ekran">◯</button>
    <button data-tus="geri" title="Geri" aria-label="Geri">◁</button>
    <button id="kapatOynatici" title="Kapat" aria-label="Kapat">✕</button>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
  const API = 'https://api.github.com';
  const WF = 'android.yml';
  const ANAHTAR = 'apk-bulut';
  const ADIMLAR = [
    ['sira', 'Sırada'],
    ['Hazırlanıyor', 'Makine hazırlanıyor'],
    ['Android indiriliyor', 'Android indiriliyor'],
    ['Android açılıyor', 'Android açılıyor'],
    ['Uygulamalar kuruluyor', 'Uygulamalar kuruluyor'],
    ['Görüntü hazırlanıyor', 'Görüntü hazırlanıyor'],
    ['hazir', 'Hazır'],
  ];
  const GIZLI = window.APK_BULUT || null;   // config.js: depo + şifreli jeton

  const $ = (id) => document.getElementById(id);
  let ayar = oku();
  if (GIZLI) ayar.repo = GIZLI.repo;
  if (!ayar.jwk || !ayar.pub) ayar = { repo: ayar.repo };   // eski/eksik kayıt: şifre yeniden sorulur
  let run = null;          // aktif iş akışı çalıştırması
  let durum = null;        // son commit durumu
  let link = null;         // { muhur, url } — çözülmüş oturum linki
  let yoklamaZamani = null;
  let durduruluyor = false;

  function oku() {
    try { return JSON.parse(localStorage.getItem(ANAHTAR)) || {}; } catch { return {}; }
  }
  function yaz(v) {
    try { localStorage.setItem(ANAHTAR, JSON.stringify(v)); } catch { /* özel pencere */ }
  }

  async function gh(yol, secenek = {}) {
    const res = await fetch(API + yol, {
      method: secenek.method || 'GET',
      cache: 'no-store',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + ayar.token,
        ...(secenek.body ? { 'Content-Type': 'application/json' } : {}),
      },
      body: secenek.body ? JSON.stringify(secenek.body) : undefined,
    });
    if (res.status === 204 || res.status === 202) return null;
    if (!res.ok) {
      const e = new Error(hataMetni(res.status));
      e.status = res.status;
      // Kayıtlı jeton artık geçmiyorsa cihazdaki kaydı sil, şifreyi yeniden sor.
      if (res.status === 401 && oku().token) cikis(e.message);
      throw e;
    }
    return res.json();
  }

  function hataMetni(kod) {
    if (kod === 401) return 'Jeton geçersiz ya da süresi dolmuş. Bilgisayarda sifrele.js ile yenileyip siteyi tekrar gönder.';
    if (kod === 403) return 'Jetonun izni yetmiyor (Actions: yazma, Commit statuses: okuma gerekli) ya da istek sınırı aşıldı.';
    if (kod === 404) return 'Depo ya da iş akışı bulunamadı. Depo adı doğru mu, jeton bu depoyu seçiyor mu?';
    if (kod === 422) return 'İş akışı başlatılamadı. android.yml ana dalda mı?';
    return 'GitHub hatası (' + kod + ').';
  }

  function goster(bolum) {
    for (const id of ['kurulum', 'baslat', 'oturum']) $(id).hidden = id !== bolum;
    $('ayarlarBtn').hidden = bolum === 'kurulum';
  }

  // ---- Şifre ----
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function jetonuCoz(sifre) {
    const ham = await crypto.subtle.importKey('raw', new TextEncoder().encode(sifre), 'PBKDF2', false, ['deriveKey']);
    const anahtar = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: b64(GIZLI.salt), iterations: GIZLI.iter },
      ham, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
    );
    const acik = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(GIZLI.iv) }, anahtar, b64(GIZLI.veri));
    return new TextDecoder().decode(acik);
  }

  $('sifreForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('kurulumHata').textContent = '';
    const sifre = $('sifre').value;
    if (!sifre) return;
    $('kaydet').disabled = true;
    $('kaydet').textContent = 'Kontrol ediliyor…';
    let acik;
    try {
      acik = JSON.parse(await jetonuCoz(sifre));
    } catch {
      $('kurulumHata').textContent = 'Şifre yanlış.';
      $('kaydet').disabled = false;
      $('kaydet').textContent = 'Giriş';
      return;
    }
    ayar = { repo: GIZLI.repo, token: acik.t, jwk: acik.k, pub: acik.p };
    try {
      const bilgi = await gh('/repos/' + ayar.repo);
      ayar.dal = bilgi.default_branch || 'main';
      yaz(ayar);
      $('sifre').value = '';
      await aktifiBul();
    } catch (e) {
      ayar = { repo: GIZLI.repo };
      $('kurulumHata').textContent = e.message;
    } finally {
      $('kaydet').disabled = false;
      $('kaydet').textContent = 'Giriş';
    }
  });

  // ---- Oturum linki ----
  // İş akışı linki bu cihazın açık anahtarına şifreler (scripts/muhurle.js):
  // base64url( tek_kullanımlık_açık_anahtar[65] || AES-GCM şifreli metin ), metin = "mod|alt_alan|sır"
  const b64u = (s) => b64(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (s.length % 4)) % 4));

  async function muhruAc(muhur) {
    const b = b64u(muhur);
    if (b.length < 65 + 16 + 5) throw new Error('kısa mühür');
    const ozel = await crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: ayar.jwk.x, y: ayar.jwk.y, d: ayar.jwk.d },
      { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    const tek = await crypto.subtle.importKey('raw', b.slice(0, 65), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const ortak = await crypto.subtle.deriveBits({ name: 'ECDH', public: tek }, ozel, 256);
    const hk = await crypto.subtle.importKey('raw', ortak, 'HKDF', false, ['deriveBits']);
    const km = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('apk-bulut') }, hk, 44 * 8));
    const aes = await crypto.subtle.importKey('raw', km.slice(0, 32), 'AES-GCM', false, ['decrypt']);
    const metin = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: km.slice(32) }, aes, b.slice(65)));
    const [mod, alt, sir] = metin.split('|');
    if (!/^[sh]$/.test(mod) || !/^[a-z0-9]+(-[a-z0-9]+)+$/.test(alt) || !/^[A-Za-z0-9_-]{16,64}$/.test(sir)) {
      throw new Error('bozuk içerik');
    }
    // Akış bu köke gömülür: kapı /k/<sır>/ altını uygulamaya aktarır.
    return { taban: 'https://' + alt + '.trycloudflare.com/k/' + sir + '/', alt, sir };
  }

  async function linkiHazirla() {
    const hedef = durum && durum.state === 'success' ? String(durum.target_url || '') : '';
    const i = hedef.indexOf('#');
    const muhur = i >= 0 ? hedef.slice(i + 1) : '';
    if (!muhur) { link = null; return; }
    if (link && link.muhur === muhur) return;
    try {
      link = { muhur, ...(await muhruAc(muhur)) };
    } catch {
      link = { muhur, taban: null };
    }
  }

  $('ayarlarBtn').addEventListener('click', () => {
    cikis('');
  });

  // ---- Tam ekran oynatıcı (akışı kendi sayfamıza gömer) ----
  const UDID = 'emulator-5554';            // tek AVD'nin sabit seri numarası
  let ctlZaman = 0;

  function embedUrl() {
    const t = link.taban;                  // https://<alt>.trycloudflare.com/k/<sır>/
    const u = new URL('tam.html', t);      // kapının sunduğu sayfa: akış soketini /k/<sır>/ altına yönlendirir
    const p = u.searchParams;
    const o = new URL(t);
    p.set('device', UDID);
    p.set('host', o.hostname);
    p.set('port', '443');
    p.set('secure', 'true');
    p.set('pathname', o.pathname);         // /k/<sır>/  → WebSocket buradan geçer, kapı eşler
    p.set('codec', 'h264');                // emülatörde hızlı ve uyumlu
    p.set('encoder', 'c2.android.avc.encoder');
    p.set('deviceKind', 'phone');          // dokunmatik mod (yoksa TV kumandası moduna düşer)
    p.set('audio', 'true');
    p.set('maxFps', '60');
    p.set('bitrate', '8000000');
    return u.toString();
  }

  async function ctl(yol) {
    if (!link || !link.taban) return;
    try { await fetch(link.taban + '_ctl/' + yol, { cache: 'no-store', mode: 'cors' }); } catch { /* yut */ }
  }

  function yonBildir() {
    const a = (screen.orientation && typeof screen.orientation.angle === 'number')
      ? screen.orientation.angle
      : (typeof window.orientation === 'number' ? ((window.orientation % 360) + 360) % 360 : 0);
    // Ekran açısı → cihaz açısı (ters yön): 90 çevirince telefon -90 dönmüş gibi görünür.
    const now = Date.now();
    if (now - ctlZaman < 250) return;      // savurmayı sınırla
    ctlZaman = now;
    ctl('yon?a=' + ((360 - a) % 360));
  }

  function oynaticiAc() {
    if (!link || !link.taban) return;
    $('ekran').src = embedUrl();
    $('oynatici').hidden = false;
    document.addEventListener('fullscreenchange', tamEkranKontrol);
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', yonBildir);
    } else {
      window.addEventListener('orientationchange', yonBildir);
    }
    yonBildir();
  }

  function oynaticiKapat() {
    $('oynatici').hidden = true;
    $('ekran').src = 'about:blank';
    if (screen.orientation && screen.orientation.removeEventListener) {
      screen.orientation.removeEventListener('change', yonBildir);
    } else {
      window.removeEventListener('orientationchange', yonBildir);
    }
    document.removeEventListener('fullscreenchange', tamEkranKontrol);
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  }

  function tamEkranKontrol() {
    // Kullanıcı tam ekrandan çıkınca oynatıcıyı kapatma; sadece bırak.
  }

  $('acBtn').addEventListener('click', oynaticiAc);
  $('kapatOynatici').addEventListener('click', oynaticiKapat);
  document.querySelectorAll('#cubuk button[data-tus]').forEach((b) => {
    b.addEventListener('click', () => ctl('tus?k=' + b.getAttribute('data-tus')));
  });

  function cikis(mesaj) {
    oynaticiKapat();
    clearTimeout(yoklamaZamani);
    run = null; durum = null; link = null;
    ayar = { repo: GIZLI && GIZLI.repo };
    try { localStorage.removeItem(ANAHTAR); } catch { /* yok say */ }
    goster('kurulum');
    $('kurulumHata').textContent = mesaj;
  }

  // ---- Başlat ----
  $('baslatBtn').addEventListener('click', async () => {
    $('baslatHata').textContent = '';
    const apk = $('apk').value.trim();
    if (apk && !/^https:\/\//i.test(apk)) { $('baslatHata').textContent = 'APK linki https:// ile başlamalı.'; return; }
    $('baslatBtn').disabled = true;
    try {
      const once = await gh(runlarYolu(1));
      const oncekiId = once.workflow_runs[0]?.id || 0;
      await gh('/repos/' + ayar.repo + '/actions/workflows/' + WF + '/dispatches', {
        method: 'POST',
        body: {
          ref: ayar.dal || 'main',
          inputs: {
            dakika: $('sure').value,
            anahtar: ayar.pub,
            apk_url: apk,
          },
        },
      });
      run = null; durum = null; link = null; durduruluyor = false;
      goster('oturum');
      ciz();
      // Yeni çalıştırmanın görünmesini bekle
      for (let i = 0; i < 30 && !run; i++) {
        await bekle(2000);
        const r = await gh(runlarYolu(5));
        run = r.workflow_runs.find((x) => x.id > oncekiId) || null;
      }
      if (!run) throw new Error('Çalıştırma görünmedi. GitHub Actions sayfasını kontrol et.');
      yokla();
    } catch (e) {
      goster('baslat');
      $('baslatHata').textContent = e.message;
    } finally {
      $('baslatBtn').disabled = false;
    }
  });

  function runlarYolu(n) {
    return '/repos/' + ayar.repo + '/actions/workflows/' + WF + '/runs?per_page=' + n;
  }

  // ---- Oturum ----
  $('durdurBtn').addEventListener('click', async () => {
    if (!run) return;
    $('durdurBtn').disabled = true;
    try {
      await gh('/repos/' + ayar.repo + '/actions/runs/' + run.id + '/cancel', { method: 'POST' });
      durduruluyor = true;
      ciz();
      yokla();
    } catch (e) {
      $('oturumHata').textContent = e.message;
      $('durdurBtn').disabled = false;
    }
  });

  async function aktifiBul() {
    try {
      const r = await gh(runlarYolu(5));
      run = r.workflow_runs.find((x) => x.status !== 'completed') || null;
    } catch (e) {
      if (e.status !== 401) { goster('baslat'); $('baslatHata').textContent = e.message; }
      return;
    }
    if (run) { goster('oturum'); yokla(); } else { goster('baslat'); }
  }

  async function yokla() {
    clearTimeout(yoklamaZamani);
    if (!run) return;
    try {
      run = await gh('/repos/' + ayar.repo + '/actions/runs/' + run.id);
      const liste = await gh('/repos/' + ayar.repo + '/commits/' + run.head_sha + '/statuses?per_page=100');
      durum = liste.find((s) => s.context === 'android/' + run.id) || null;
      await linkiHazirla();
      $('oturumHata').textContent = '';
    } catch (e) {
      $('oturumHata').textContent = e.message;
    }
    ciz();
    if (run && run.status !== 'completed') {
      const hazir = durum && durum.state === 'success';
      yoklamaZamani = setTimeout(yokla, hazir ? 15000 : 4000);
    }
  }

  function adimIndex() {
    if (!durum) return 0;
    if (durum.state === 'success') return ADIMLAR.length - 1;
    const i = ADIMLAR.findIndex(([k]) => k === durum.description);
    return i < 0 ? 1 : i;
  }

  function bitisZamani() {
    const m = durum && /bitis=(\d+)/.exec(durum.description || '');
    return m ? Number(m[1]) * 1000 : null;
  }

  function sure(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const sa = Math.floor(s / 3600), dk = Math.floor((s % 3600) / 60), sn = s % 60;
    const iki = (n) => String(n).padStart(2, '0');
    return sa ? sa + ':' + iki(dk) + ':' + iki(sn) : dk + ':' + iki(sn);
  }

  function ciz() {
    if ($('oturum').hidden) return;
    const baslik = $('durumBaslik'), alt = $('durumAlt'), ac = $('acBtn');
    $('runLink').hidden = !run;
    if (run) $('runLink').href = run.html_url;

    if (!run) {
      baslik.textContent = 'Başlatılıyor';
      alt.textContent = 'GitHub çalıştırmayı oluşturuyor…';
      ac.hidden = true;
      adimlariCiz(0);
      return;
    }

    if (run.status === 'completed') {
      oynaticiKapat();
      const nedenler = { cancelled: 'Durduruldu.', success: 'Süre doldu.', failure: 'Hata ile bitti. Ayrıntılar GitHub\'da.', timed_out: 'Zaman aşımı.' };
      baslik.textContent = 'Oturum bitti';
      alt.textContent = nedenler[run.conclusion] || (run.conclusion || '');
      ac.hidden = true;
      $('durdurBtn').hidden = true;
      $('adimlar').innerHTML = '';
      clearTimeout(yoklamaZamani);
      const biten = run;
      setTimeout(() => { if (run === biten) { run = null; durum = null; goster('baslat'); } }, 6000);
      return;
    }

    if (durum && durum.state === 'error') {
      baslik.textContent = 'Kapanıyor';
      alt.textContent = durum.description || '';
      ac.hidden = true;
      $('durdurBtn').hidden = true;
      $('adimlar').innerHTML = '';
      return;
    }

    $('durdurBtn').hidden = false;
    $('durdurBtn').disabled = durduruluyor;
    $('durdurBtn').textContent = durduruluyor ? 'Durduruluyor…' : 'Durdur';

    const hazir = durum && durum.state === 'success' && link;
    if (hazir) {
      baslik.textContent = 'Android hazır';
      const bitis = bitisZamani();
      alt.innerHTML = '';
      alt.append('Kalan süre: ');
      const k = document.createElement('span');
      k.className = 'kalan';
      k.id = 'kalan';
      k.textContent = bitis ? sure(bitis - Date.now()) : '—';
      alt.append(k);
      $('adimlar').innerHTML = '';
      if (link.taban) {
        ac.hidden = false;
        $('oturumHata').textContent = '';
      } else {
        ac.hidden = true;
        $('oturumHata').textContent = 'Oturum çözülemedi. Site şifresi yenilendiyse bu cihazda çıkış yapıp tekrar gir.';
      }
    } else {
      const i = adimIndex();
      baslik.textContent = run.status === 'queued' && !durum ? 'Sırada' : ADIMLAR[i][1];
      const basla = run.run_started_at ? Date.parse(run.run_started_at) : null;
      alt.textContent = basla ? 'Geçen süre ' + sure(Date.now() - basla) : 'Makine bekleniyor';
      ac.hidden = true;
      adimlariCiz(i);
    }
  }

  function adimlariCiz(simdi) {
    const ul = $('adimlar');
    ul.innerHTML = '';
    ADIMLAR.slice(1).forEach(([, ad], j) => {
      const li = document.createElement('li');
      const idx = j + 1;
      li.textContent = ad;
      if (idx < simdi) li.className = 'bitti';
      else if (idx === simdi) li.className = 'simdi';
      ul.append(li);
    });
  }

  function bekle(ms) { return new Promise((r) => setTimeout(r, ms)); }

  // Saniyelik sayaç (yalnızca metin günceller)
  setInterval(() => {
    if (!run || $('oturum').hidden) return;
    const k = $('kalan');
    const bitis = bitisZamani();
    if (k && bitis) { k.textContent = sure(bitis - Date.now()); return; }
    if ((!durum || durum.state === 'pending') && run.status !== 'completed' && run.run_started_at) {
      $('durumAlt').textContent = 'Geçen süre ' + sure(Date.now() - Date.parse(run.run_started_at));
    }
  }, 1000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && run) yokla();
  });

  // ---- Açılış ----
  if (!GIZLI) {
    goster('kurulum');
    $('sifreForm').hidden = true;
    $('kurulumHata').textContent = 'config.js bulunamadı. Bilgisayarda sifrele.js çalıştırıp siteyi tekrar gönder.';
  } else if (ayar.token) {
    aktifiBul();
  } else {
    goster('kurulum');
  }
})();
</script>
</body>
</html>
